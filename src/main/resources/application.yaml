server:
  port: 8084

spring:
  application:
    name: ms-order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/order_db}
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  liquibase:
    change-log: classpath:/liquibase/changelog-master.yaml
    enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

application:
  config:
    courier-service-url: ${COURIER_SERVICE_URL:http://localhost:9001}
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8083}